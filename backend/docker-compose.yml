services:
  ftms-api:
    build:
      context: .
      dockerfile: FTMS.API/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development.docker
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourPassword123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/ftms-api.pfx
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro