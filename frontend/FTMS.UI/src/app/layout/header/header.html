<header class="app-header">
  <div class="app-title">
    <h2>DispatchFlow</h2>

    <span class="app-subtitle"> Fleet Transportation Management </span>
  </div>

  <div class="user-info">
    <div class="user-details">
      <span class="username">
        {{ username }}
      </span>

      <span class="role">
        {{ role }}
      </span>
    </div>

    <button (click)="logout()">Logout</button>
  </div>
</header>
